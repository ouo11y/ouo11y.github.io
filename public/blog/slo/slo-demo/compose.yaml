# SLO demo: Tiny Shop checkout, Prometheus with Sloth-generated rules, Alertmanager, Grafana.
# docker compose -p slo-demo up -d
name: slo-demo
services:
  shop:
    image: python:3.13-slim
    command: ["python", "-u", "/app/shop.py", "serve"]
    volumes: ["./app:/app:ro"]
    ports: ["23080:8080"]

  loadgen:
    image: python:3.13-slim
    command: ["python", "-u", "/app/shop.py", "loadgen"]
    environment: { TARGET: "http://shop:8080", RPS: "20" }
    volumes: ["./app:/app:ro"]
    depends_on: [shop]

  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes: ["./prometheus:/etc/prometheus:ro"]
    ports: ["23090:9090"]

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.2
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./alertmanager:/etc/alertmanager:ro"]
    ports: ["23093:9093"]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["23000:3000"]
