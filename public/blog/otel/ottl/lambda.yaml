receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  transform:
    error_mode: ignore
    log_statements:
      - set(log.attributes["http.headers"], Filter(log.attributes["http.headers"], (k, _) => not IsMatch(k, "(?i)^(authorization|cookie)$")))
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform]
      exporters: [debug]
