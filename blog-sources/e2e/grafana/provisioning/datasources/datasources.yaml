# Three datasources and the links between them. The uids are fixed so links can name them.
#   Loki  -> Tempo: a log record's trace_id opens the trace.
#   Tempo -> Loki:  a span opens the logs written while it ran (same trace_id).
#   Tempo -> Mimir: a span opens its service's request rate and latency.
#   Mimir -> Tempo: an exemplar's trace_id opens the trace behind that dot on the graph.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        tags:
          - { key: service.name, value: service_name }
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: -10m
        spanEndTimeShift: 10m
        tags:
          - { key: service.name, value: service_name }
        queries:
          - name: Request rate
            query: sum(rate(traces_span_metrics_calls{$$__tags}[1m]))
          - name: p95 latency
            query: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_bucket{$$__tags}[1m])))
      lokiSearch:
        datasourceUid: loki

  - name: Mimir
    uid: mimir
    type: prometheus
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      prometheusType: Mimir
      timeInterval: 10s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
